<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="glow-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glow-grad-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="badge-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <style>
      @keyframes pulse-1 {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.55; }
        50% { transform: scale(1.15) translate(-30px, 20px); opacity: 0.8; }
      }
      @keyframes pulse-2 {
        0%, 100% { transform: scale(1.05) translate(0px, 0px); opacity: 0.5; }
        50% { transform: scale(0.9) translate(25px, -15px); opacity: 0.75; }
      }
      @keyframes float-particle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes pulse-node {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 6.5px; opacity: 0.9; }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes badge-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .ambient-orb-1 {
        animation: pulse-1 12s ease-in-out infinite;
        transform-origin: 250px 150px;
      }
      .ambient-orb-2 {
        animation: pulse-2 15s ease-in-out infinite;
        transform-origin: 950px 280px;
      }
      .flowing-line {
        stroke-dasharray: 8 12;
        animation: dash-flow 8s linear infinite;
      }
      .node-pulse-1 { animation: pulse-node 3s ease-in-out infinite; }
      .node-pulse-2 { animation: pulse-node 4s ease-in-out infinite 1.5s; }
      .node-pulse-3 { animation: pulse-node 3.5s ease-in-out infinite 0.7s; }
      .pill-badge { animation: badge-float 6s ease-in-out infinite; }
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Dynamic / Animated Visual Glows -->
  <g id="background-animations" opacity="0.85">
    <circle class="ambient-orb-1" cx="220" cy="130" r="220" fill="url(#glow-grad-1)" filter="url(#blur-filter)"/>
    <circle class="ambient-orb-2" cx="980" cy="280" r="240" fill="url(#glow-grad-2)" filter="url(#blur-filter)"/>
    <circle cx="600" cy="80" r="160" fill="#6366f1" opacity="0.08" filter="url(#blur-filter)"/>

    <!-- Subtle Connected Network Lines (Representing Sync & Knowledge Graph) -->
    <path class="flowing-line" d="M 80 340 Q 250 280 420 320 T 780 290 T 1120 340" fill="none" stroke="#4f46e5" stroke-width="1.8" opacity="0.35"/>
    <path class="flowing-line" d="M 120 100 Q 300 160 520 110 T 890 140 T 1100 90" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Dynamic Glowing Synapse Nodes -->
    <circle class="node-pulse-1" cx="250" cy="280" fill="#38bdf8"/>
    <circle class="node-pulse-2" cx="600" cy="305" fill="#a855f7"/>
    <circle class="node-pulse-3" cx="890" cy="140" fill="#34d399"/>
    <circle class="node-pulse-1" cx="780" cy="290" fill="#818cf8"/>
  </g>

  <!-- Grid overlay for tech aesthetic -->
  <g stroke="#334155" stroke-width="1" opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Foreground Content: Unobstructed, high contrast -->
  <g id="foreground-text">
    <!-- Top Category Tag -->
    <g transform="translate(600, 75)">
      <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#badge-grad-1)" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="0" y="5" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
        ⚡ AWESOME ECOSYSTEM DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" font-size="46" font-weight="900" text-anchor="middle" fill="url(#title-grad)" filter="url(#text-shadow)" letter-spacing="-0.8">
      Mobile Workspace &amp; Documentation
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-size="19" font-weight="500" text-anchor="middle" fill="#cbd5e1" filter="url(#text-shadow)">
      Curated Guide to Mobile Note-Taking, Offline Knowledge Bases &amp; Self-Hosted Documentation
    </text>

    <!-- Interactive Badges / Capability Highlights -->
    <g class="pill-badge" transform="translate(180, 290)">
      <!-- Pill 1: Mobile-First -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <text x="90" y="26" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
          📱 Mobile-First Sync
        </text>
      </g>

      <!-- Pill 2: Offline Knowledge -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <text x="100" y="26" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
          ⚡ Offline Knowledge Base
        </text>
      </g>

      <!-- Pill 3: E2E Privacy -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <text x="95" y="26" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
          🔒 E2EE &amp; Data Privacy
        </text>
      </g>

      <!-- Pill 4: Open Source & Self-Hosted -->
      <g transform="translate(660, 0)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <text x="90" y="26" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
          🚀 Open-Source &amp; SaaS
        </text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="600" y="385" font-size="13" font-weight="500" text-anchor="middle" fill="#64748b">
      Verified Pricing &#8226; Free Tier Limits &#8226; GitHub Star Rankings &#8226; Market Dynamics
    </text>
  </g>
</svg>
